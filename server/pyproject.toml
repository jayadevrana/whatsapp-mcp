[project]
name = "whatsapp-mcp-readonly"
version = "0.1.0"
description = "Read-only WhatsApp MCP server — reads chats/media, builds client-context docs. Cannot send."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["main", "whatsapp"]
